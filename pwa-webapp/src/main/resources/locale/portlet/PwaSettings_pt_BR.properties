pwaSettings.enablePwa.help3=N.B.: Esta opção só é possível usando navegadores modernos (baseados em cromias)
pwaSettings.enablePwa.help4=Você pode personalizar sua experiência: - Nome é por padrão o nome da empresa - Ícones são por padrão o logotipo da empresa - Cor de fundo é, por padrão, a cor primária

