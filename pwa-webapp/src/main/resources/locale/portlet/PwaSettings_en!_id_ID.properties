pwaSettings.enablePwa.tooltip=Mengapa Aplikasi Web Progresif (PWA)?
pwaSettings.enablePwa.help1=Aplikasi Web Progresif (PWA) memungkinkan pengguna Anda mengakses platform seolah-olah itu adalah aplikasi asli, menawarkan pengalaman yang lebih cepat dan terintegrasi di perangkat apa pun. 
pwaSettings.enablePwa.help2=PWA akan menampilkan warna, logo, dan merek komunitas Anda, menyediakan antarmuka seperti aplikasi yang dipersonalisasi.
pwaSettings.enablePwa.help3=Jika diaktifkan, pengguna akan diminta untuk menginstal PWA untuk memudahkan akses terhadap branding komunitas Anda. Jika tidak, mereka harus menggunakan platform tersebut melalui browser web mereka.
pwaSettings.enablePwa.help4=Nota Bene: Fitur ini memerlukan dukungan terhadap standar PWA oleh browser dan sistem operasi, artinya fitur ini hanya tersedia di perangkat dan browser modern dan terkini.

