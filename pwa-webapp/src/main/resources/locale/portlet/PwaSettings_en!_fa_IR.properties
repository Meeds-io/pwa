pwaSettings.enablePwa.help1=یک برنامه وب پیشرفته (PWA) به کاربران شما اجازه می دهد تا به پلتفرم مانند یک برنامه بومی دسترسی داشته باشند و تجربه سریعتر و یکپارچه تری را در هر دستگاهی ارائه دهند.
pwaSettings.enablePwa.help2=PWA رنگ‌ها، آرم‌ها و نام تجاری جامعه شما را به نمایش می‌گذارد و یک رابط برنامه‌مانند شخصی‌سازی می‌کند.
pwaSettings.enablePwa.help3=در صورت فعال بودن، از کاربران خواسته می شود که PWA را برای دسترسی آسان با نام تجاری جامعه شما نصب کنند. در غیر این صورت، آنها باید از طریق مرورگر وب خود از پلتفرم استفاده کنند.
pwaSettings.enablePwa.help4=Nota Bene: این ویژگی نیاز به پشتیبانی از استانداردهای PWA توسط مرورگر و سیستم عامل دارد، به این معنی که فقط در دستگاه ها و مرورگرهای مدرن و به روز در دسترس است.

