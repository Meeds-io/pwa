pwaSettings.characteristics=Aplicació mòbil o escriptori
pwaSettings.subtitle.characteristics=Proporcioneu una experiència personalitzada als vostres usuaris
pwaSettings.enablePwa=Permet als usuaris instal·lar l'{0}aplicació web progressiva{1}
pwaSettings.enablePwa.tooltip=Per què una aplicació web progressiva (PWA)?
pwaSettings.enablePwa.help1=Una aplicació web progressiva (PWA) permet als vostres usuaris accedir a la plataforma com si es tractés d'una aplicació nativa, oferint una experiència més ràpida i integrada en qualsevol dispositiu. 
pwaSettings.enablePwa.help2=El PWA inclourà els colors, els logotips i la marca de la vostra comunitat, proporcionant una interfície personalitzada semblant a una aplicació.
pwaSettings.enablePwa.help3=Si està activat, se'ls demanarà als usuaris que instal·lin el PWA per accedir fàcilment amb la marca de la vostra comunitat. En cas contrari, hauran d'utilitzar la plataforma mitjançant el seu navegador web.
pwaSettings.enablePwa.help4=Nota Bene: aquesta funció requereix compatibilitat amb els estàndards PWA pel navegador i el sistema operatiu, és a dir, només està disponible en dispositius i navegadors moderns i actualitzats.

