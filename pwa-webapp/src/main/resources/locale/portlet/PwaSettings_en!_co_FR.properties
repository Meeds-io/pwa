pwaSettings.enablePwa.tooltip=Perchè una App Web Progressiva (PWA)?
pwaSettings.enablePwa.help1=A Progressive Web App (PWA) permette à i vostri utilizatori di accede à a piattaforma cum'è s'ellu era una app nativa, chì offre una sperienza più veloce è integrata in ogni dispositivu. 
pwaSettings.enablePwa.help2=U PWA presenta i culori, i loghi è a marca di a vostra cumunità, chì furnisce una interfaccia persunalizata cum'è app.
pwaSettings.enablePwa.help3=Se attivatu, l'utilizatori seranu invitati à installà u PWA per un accessu faciule cù a marca di a vostra cumunità. Altrimenti, anu bisognu di utilizà a piattaforma attraversu u so navigatore web.
pwaSettings.enablePwa.help4=Nota Bene: Questa funzione richiede supportu per i normi PWA da u navigatore è u sistema operatore, vale à dì chì hè solu dispunibule nantu à i dispositi è navigatori muderni, aghjurnati.

