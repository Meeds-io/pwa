pwaSettings.characteristics=Mobile o Desktop App
pwaSettings.subtitle.characteristics=Magbigay ng customized na karanasan sa iyong mga user
pwaSettings.enablePwa=Payagan ang mga user na i-install ang {0}Progressive Web App{1}
pwaSettings.enablePwa.tooltip=Bakit isang Progressive Web App (PWA)?
pwaSettings.enablePwa.help1=Ang Progressive Web App (PWA) ay nagbibigay-daan sa iyong mga user na ma-access ang platform na parang ito ay isang native na app, na nag-aalok ng mas mabilis at mas pinagsamang karanasan sa anumang device. 
pwaSettings.enablePwa.help2=Itatampok ng PWA ang mga kulay, logo, at pagba-brand ng iyong komunidad, na nagbibigay ng naka-personalize na interface na tulad ng app.
pwaSettings.enablePwa.help3=Kung pinagana, ipo-prompt ang mga user na i-install ang PWA para sa madaling pag-access sa pagba-brand ng iyong komunidad. Kung hindi, kakailanganin nilang gamitin ang platform sa pamamagitan ng kanilang web browser.
pwaSettings.enablePwa.help4=Nota Bene: Nangangailangan ang feature na ito ng suporta para sa mga pamantayan ng PWA ng browser at operating system, ibig sabihin, available lang ito sa mga moderno, napapanahon na device at browser.

