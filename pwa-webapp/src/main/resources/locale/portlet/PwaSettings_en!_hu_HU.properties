pwaSettings.enablePwa.help1=A progresszív webalkalmazás (PWA) lehetővé teszi a felhasználók számára, hogy úgy érjék el a platformot, mintha az natív alkalmazás lenne, gyorsabb és integráltabb élményt kínálva bármilyen eszközön. 
pwaSettings.enablePwa.help2=A PWA a közösség színeit, logóit és márkajelzését fogja tartalmazni, személyre szabott alkalmazásszerű felületet biztosítva.
pwaSettings.enablePwa.help3=Ha engedélyezve van, a felhasználók felkérik a PWA telepítésére, hogy könnyen hozzáférhessenek a közösség márkajelzéséhez. Ellenkező esetben a platformot a webböngészőjükön keresztül kell használniuk.
pwaSettings.enablePwa.help4=Megjegyzés: Ehhez a funkcióhoz a böngésző és az operációs rendszer PWA-szabványainak támogatása szükséges, vagyis csak a modern, naprakész eszközökön és böngészőkön érhető el.

