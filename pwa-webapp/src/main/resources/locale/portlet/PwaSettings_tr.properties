pwaSettings.enablePwa.tooltip=Neden Progresif Web Uygulaması (PWA)?
pwaSettings.enablePwa.help1=Progresif Web Uygulaması (PWA), kullanıcılarınızın platforma yerel bir uygulamaymış gibi erişmesine olanak tanır ve her cihazda daha hızlı ve daha entegre bir deneyim sunar.
pwaSettings.enablePwa.help2=PWA, topluluğunuzun renklerini, logolarını ve markasını içerecek ve kişiselleştirilmiş bir uygulama benzeri arayüz sağlayacaktır.
pwaSettings.enablePwa.help3=Etkinleştirilirse, kullanıcılar topluluğunuzun markasıyla kolay erişim için PWA'yı yüklemeye yönlendirilecektir. Aksi takdirde, platformu web tarayıcıları aracılığıyla kullanmaları gerekecektir.
pwaSettings.enablePwa.help4=Not: Bu özellik, tarayıcı ve işletim sistemi tarafından PWA standartlarının desteklenmesini gerektirir; bu da yalnızca modern, güncel cihazlarda ve tarayıcılarda kullanılabilir olduğu anlamına gelir.

