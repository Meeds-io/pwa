pwaSettings.enablePwa.tooltip=Zakaj progresivna spletna aplikacija (PWA)?
pwaSettings.enablePwa.help1=Progresivna spletna aplikacija (PWA) omogoča vašim uporabnikom dostop do platforme, kot da bi bila izvorna aplikacija, ki ponuja hitrejšo in bolj integrirano izkušnjo v kateri koli napravi.
pwaSettings.enablePwa.help2=PWA bo vseboval barve, logotipe in blagovno znamko vaše skupnosti, kar bo zagotovilo prilagojen vmesnik, podoben aplikaciji.
pwaSettings.enablePwa.help3=Če je omogočeno, bodo uporabniki pozvani, naj namestijo PWA za enostaven dostop z blagovno znamko vaše skupnosti. V nasprotnem primeru bodo morali uporabljati platformo prek spletnega brskalnika.
pwaSettings.enablePwa.help4=Opomba: ta funkcija zahteva podporo za standarde PWA s strani brskalnika in operacijskega sistema, kar pomeni, da je na voljo samo v sodobnih, posodobljenih napravah in brskalnikih.

