pwaSettings.enablePwa=Permitir Modo {0}Progressive Web App{1}
pwaSettings.enablePwa.tooltip=Porquê uma Progressive Web App (PWA)?
pwaSettings.enablePwa.help1=Uma Progressive Web App (PWA) permite que os seus utilizadores acedam à plataforma como se fosse uma aplicação nativa e oferece uma experiência mais rápida e integrada em qualquer dispositivo. 
pwaSettings.enablePwa.help2=A PWA terá as cores, os logótipos e a identidade visual da sua comunidade, o que proporciona uma interface personalizada semelhante a uma aplicação.
pwaSettings.enablePwa.help3=Se esta opção estiver ativada, os utilizadores serão convidados a instalar a PWA para um acesso fácil com a identidade visual da sua comunidade. Caso contrário, terão de utilizar a plataforma através do navegador.
pwaSettings.enablePwa.help4=Nota Bene: esta funcionalidade requer que o navegador e o sistema operativo suportem as normas PWA, pelo que só está disponível em dispositivos e navegadores modernos e atualizados.

