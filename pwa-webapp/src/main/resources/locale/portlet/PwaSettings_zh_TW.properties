pwaSettings.enablePwa.tooltip=為什麼選擇漸進式 Web 應用程式 (PWA)？
pwaSettings.enablePwa.help1=漸進式 Web 應用程式 (PWA) 可讓您的使用者像存取本機應用程式一樣存取平台，從而在任何裝置上提供更快、更整合的體驗。 
pwaSettings.enablePwa.help2=PWA 將展示您社群的顏色、標誌和品牌，提供類似應用程式的個人化介面。
pwaSettings.enablePwa.help3=如果啟用，系統將提示使用者安裝 PWA，以便輕鬆存取您社群的品牌。否則，他們將需要透過網頁瀏覽器使用該平台。
pwaSettings.enablePwa.help4=注意：此功能需要瀏覽器和作業系統支援 PWA 標準，這意味著它僅在現代、最新的裝置和瀏覽器上可用。

