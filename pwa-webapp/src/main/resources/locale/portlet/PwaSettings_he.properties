pwaSettings.enablePwa.help1=אפליקציית אינטרנט מתקדמת (PWA) מאפשרת למשתמשים שלך לגשת לפלטפורמה כאילו היא אפליקציה מקורית, ומציעה חוויה מהירה ומשולבת יותר בכל מכשיר. 
pwaSettings.enablePwa.help2=ה-PWA יציג את הצבעים, הלוגו והמיתוג של הקהילה שלך, ויספק ממשק דמוי אפליקציה מותאם אישית.
pwaSettings.enablePwa.help3=אם מופעל, המשתמשים יתבקשו להתקין את ה-PWA לגישה קלה עם המיתוג של הקהילה שלך. אחרת, הם יצטרכו להשתמש בפלטפורמה דרך דפדפן האינטרנט שלהם.
pwaSettings.enablePwa.help4=הערה: תכונה זו דורשת תמיכה בתקני PWA על ידי הדפדפן ומערכת ההפעלה, כלומר היא זמינה רק במכשירים ודפדפנים חדישים ומעודכנים.

