pwaSettings.enablePwa.tooltip=Tại sao lại là Ứng dụng web lũy tiến (PWA)?
pwaSettings.enablePwa.help1=Ứng dụng web lũy tiến (PWA) cho phép người dùng của bạn truy cập vào nền tảng như thể đó là một ứng dụng gốc, mang lại trải nghiệm nhanh hơn và tích hợp hơn trên mọi thiết bị. 
pwaSettings.enablePwa.help2=PWA sẽ làm nổi bật màu sắc, logo và nhãn hiệu của cộng đồng của bạn, cung cấp giao diện giống như ứng dụng được cá nhân hóa.
pwaSettings.enablePwa.help3=Nếu được bật, người dùng sẽ được nhắc cài đặt PWA để dễ dàng truy cập thương hiệu cộng đồng của bạn. Nếu không, họ sẽ cần sử dụng nền tảng này thông qua trình duyệt web của mình.
pwaSettings.enablePwa.help4=Nota Bene: Tính năng này yêu cầu trình duyệt và hệ điều hành hỗ trợ các tiêu chuẩn PWA, nghĩa là nó chỉ khả dụng trên các thiết bị và trình duyệt hiện đại, cập nhật.

