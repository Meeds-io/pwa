pwaSettings.characteristics=모바일 또는 데스크톱 앱
pwaSettings.subtitle.characteristics=사용자에게 맞춤형 경험을 제공하세요
pwaSettings.enablePwa=사용자가 {0}프로그레시브 웹 앱{1}을 설치하도록 허용
pwaSettings.enablePwa.tooltip=프로그레시브 웹 앱(PWA) 을 사용해야 하는 이유는 무엇인가요?
pwaSettings.enablePwa.help1=PWA(프로그레시브 웹 앱) 를 사용하면 사용자가 마치 기본 앱인 것처럼 플랫폼에 액세스하여 모든 기기에서 더 빠르고 통합된 환경을 제공할 수 있습니다. 
pwaSettings.enablePwa.help2=PWA는 커뮤니티의 색상, 로고 및 브랜딩을 특징으로 하며 개인화된 앱과 같은 인터페이스를 제공합니다.
pwaSettings.enablePwa.help3=활성화되면 커뮤니티 브랜딩에 쉽게 액세스할 수 있도록 PWA를 설치하라는 메시지가 사용자에게 표시됩니다. 그렇지 않으면 웹 브라우저를 통해 플랫폼을 사용해야 합니다.
pwaSettings.enablePwa.help4=참고 사항: 이 기능을 사용하려면 브라우저 및 운영 체제에서 PWA 표준을 지원해야 합니다. 즉, 최신 장치 및 브라우저에서만 사용할 수 있습니다.

