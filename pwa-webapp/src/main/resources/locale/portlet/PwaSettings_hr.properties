pwaSettings.enablePwa.tooltip=Zašto Progressive Web App (PWA)?
pwaSettings.enablePwa.help1=Progresivna web-aplikacija (PWA) omogućuje vašim korisnicima pristup platformi kao da je izvorna aplikacija, nudeći brže i integriranije iskustvo na bilo kojem uređaju. 
pwaSettings.enablePwa.help2=PWA će sadržavati boje, logotipe i brendiranje vaše zajednice, pružajući personalizirano sučelje nalik aplikaciji.
pwaSettings.enablePwa.help3=Ako je omogućeno, od korisnika će biti zatraženo da instaliraju PWA za lakši pristup s robnom markom vaše zajednice. U suprotnom će morati koristiti platformu putem svog web preglednika.
pwaSettings.enablePwa.help4=Nota Bene: Ova značajka zahtijeva podršku za PWA standarde od strane preglednika i operativnog sustava, što znači da je dostupna samo na modernim, ažurnim uređajima i preglednicima.

