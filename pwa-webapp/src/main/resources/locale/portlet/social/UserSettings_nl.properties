UserSettings.pwa.notification.deliveryStatus.drawer.body=Een of meer pushmeldingen zijn vertraagd. Dit kan gebeuren als:\n- batterijoptimalisatie ingeschakeld is\n- de energiebesparingsmodus actief is\n- het apparaat offline was\n- de netwerkverbinding instabiel was\n- de browser of app door het systeem is gesloten\n\nControleer de volgende instellingen op uw apparaat om de aflevering van meldingen te verbeteren:\n- Schakel batterijoptimalisatie voor de app uit en sta toe dat de app op de achtergrond draait\n- Zorg dat achtergrondactiviteit is ingeschakeld voor de app\n- Controleer of meldingen en meldingen op het vergrendelscherm zijn ingeschakeld voor de app
