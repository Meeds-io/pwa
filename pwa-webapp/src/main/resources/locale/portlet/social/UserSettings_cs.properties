UserSettings.pwa.notification.deliveryStatus.drawer.summary=⌛ Push oznámení byla doručena později, než se očekávalo.
UserSettings.pwa.notification.deliveryStatus.drawer.body=Jedno nebo více push oznámení bylo zpožděno. K tomu může dojít, pokud:\n- je zapnutá optimalizace baterie\n- je aktivní úsporný režim\n- zařízení bylo offline\n- síťové připojení bylo nestabilní\n- systém zavřel prohlížeč nebo aplikaci\n\nChcete-li zlepšit doručování oznámení, zkontrolujte na svém zařízení následující nastavení:\n- Vypněte optimalizaci baterie pro aplikaci a povolte její běh na pozadí\n- Ujistěte se, že je pro aplikaci povolena aktivita na pozadí\n- Ověřte, že jsou pro aplikaci povolena oznámení a oznámení na zamčené obrazovce
