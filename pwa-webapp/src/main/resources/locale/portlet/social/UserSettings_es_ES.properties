UserSettings.pwa.notification.deliveryStatus.drawer.title=Problemas de entrega de notificaciones
UserSettings.pwa.notification.deliveryStatus.drawer.summary=⌛ Las notificaciones push se entregaron más tarde de lo esperado
UserSettings.pwa.notification.deliveryStatus.drawer.body=Una o varias notificaciones push se han retrasado. Esto puede ocurrir si:\n- La optimización de la batería está activada\n- El modo de ahorro de energía está activo\n- El dispositivo estaba sin conexión\n- La conexión de red era inestable\n- El sistema cerró el navegador o la aplicación\n\nPara mejorar la entrega de notificaciones, compruebe los siguientes ajustes en su dispositivo:\n- Desactive la optimización de la batería para la aplicación y permita que se ejecute en segundo plano\n- Asegúrese de que la actividad en segundo plano está activada para la aplicación\n- Compruebe que las notificaciones y las notificaciones en la pantalla de bloqueo están activadas para la aplicación
