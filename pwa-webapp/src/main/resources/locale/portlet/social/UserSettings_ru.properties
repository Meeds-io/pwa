UserSettings.pwa.notification.deliveryStatus.drawer.summary=⌛ Push-уведомления были доставлены позже, чем ожидалось
UserSettings.pwa.notification.deliveryStatus.drawer.body=Одно или несколько push-уведомлений были доставлены с задержкой. Это может произойти, если:\n- включена оптимизация батареи\n- активен режим энергосбережения\n- устройство было не в сети\n- сетевое подключение было нестабильным\n- браузер или приложение были закрыты системой\n\nЧтобы улучшить доставку уведомлений, проверьте следующие настройки на вашем устройстве:\n- отключите оптимизацию батареи для приложения и разрешите ему работать в фоновом режиме\n- убедитесь, что для приложения включена фоновая активность\n- убедитесь, что для приложения включены уведомления, в том числе на экране блокировки
