UserSettings.pwa.notification.deliveryStatus.drawer.title=Problèmes de réception de notification
UserSettings.pwa.notification.deliveryStatus.drawer.summary=⌛ Les notifications push ont été distribuées plus tard que prévu
UserSettings.pwa.notification.deliveryStatus.drawer.body=Une ou plusieurs notifications push ont été retardées. Cela peut se produire si :\n- L'optimisation de la batterie est activée\n- Le mode d'économie d'énergie est actif\n- L'appareil était hors ligne\n- La connexion réseau était instable\n- Le navigateur ou l'application a été fermée par le système\n\nPour améliorer la réception des notifications, vérifiez les paramètres suivants sur votre appareil :\n- Désactivez l'optimisation de la batterie pour l'application et autorisez-la à s'exécuter en arrière-plan\n- Assurez-vous que l'activité en arrière-plan est activée pour l'application\n- Vérifiez que les notifications et les notifications de l'écran de verrouillage sont activées pour l'application
UserSettings.pwa.notification.deliveryStatus.drawer.hide=Ne plus afficher
UserSettings.pwa.notification.deliveryStatus.drawer.reset=Réinitialiser
