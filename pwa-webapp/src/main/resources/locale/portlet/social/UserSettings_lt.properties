UserSettings.pwa.notification.deliveryStatus.drawer.body=Vienas ar daugiau tiesioginių pranešimų vėlavo. Taip gali nutikti, jei:\n- Įjungtas akumuliatoriaus optimizavimas\n- Įjungtas energijos taupymo režimas\n- Įrenginys buvo neprisijungęs\n- Tinklo ryšys buvo nestabilus\n- Sistema uždarė naršyklę arba programą\n\nKad pranešimai būtų pristatomi patikimiau, patikrinkite šiuos įrenginio nustatymus:\n- Išjunkite programos akumuliatoriaus optimizavimą ir leiskite jai veikti fone\n- Įsitikinkite, kad programai įjungta foninė veikla\n- Patikrinkite, ar programai įjungti pranešimai ir pranešimai užrakinimo ekrane
