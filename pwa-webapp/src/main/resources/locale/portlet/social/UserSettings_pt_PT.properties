UserSettings.pwa.notification.deliveryStatus.drawer.summary=⌛ Push notifications were delivered later than expected
UserSettings.pwa.notification.deliveryStatus.drawer.body=Uma ou mais notificações push foram atrasadas. Isto pode acontecer se:\n- A otimização da bateria estiver ativada\n- O modo de poupança de energia estiver ativo\n- O dispositivo estiver offline\n- A ligação de rede estiver instável\n- O navegador ou a aplicação tiver sido fechado pelo sistema\n\nPara melhorar a entrega de notificações, verifique as seguintes definições no seu dispositivo:\n- Desative a otimização da bateria para a aplicação e permita que seja executada em segundo plano\n- Certifique-se de que a atividade em segundo plano está ativada para a aplicação\n- Verifique se as notificações e as notificações no ecrã de bloqueio estão ativadas para a aplicação
