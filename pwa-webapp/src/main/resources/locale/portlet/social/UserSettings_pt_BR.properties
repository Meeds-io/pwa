UserSettings.pwa.notification.deliveryStatus.drawer.summary=⌛ Notificações push foram entregues mais tarde do que o esperado
UserSettings.pwa.notification.deliveryStatus.drawer.body=Uma ou mais notificações push chegaram com atraso. Isso pode acontecer se:\n- A otimização de bateria estiver ativada\n- O modo de economia de energia estiver ativo\n- O dispositivo estava offline\n- A conexão de rede estava instável\n- O navegador ou o aplicativo foi fechado pelo sistema\n\nPara melhorar a entrega de notificações, verifique as seguintes configurações no seu dispositivo:\n- Desative a otimização de bateria para o aplicativo e permita que ele seja executado em segundo plano\n- Certifique-se de que a atividade em segundo plano esteja ativada para o aplicativo\n- Verifique se as notificações e as notificações na tela de bloqueio estão ativadas para o aplicativo
