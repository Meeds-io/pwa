UserSettings.pwa.notification.deliveryStatus.drawer.summary=⌛ Notificările push au fost livrate mai târziu decât era de așteptat
UserSettings.pwa.notification.deliveryStatus.drawer.body=Una sau mai multe notificări push au fost întârziate. Acest lucru se poate întâmpla dacă:\n- Optimizarea bateriei este activată\n- Modul de economisire a energiei este activ\n- Dispozitivul a fost offline\n- Conexiunea la rețea a fost instabilă\n- Browserul sau aplicația a fost închisă de sistem\n\nPentru a îmbunătăți livrarea notificărilor, verificați următoarele setări de pe dispozitiv:\n- Dezactivați optimizarea bateriei pentru aplicație și permiteți-i să ruleze în fundal\n- Asigurați-vă că activitatea în fundal este activată pentru aplicație\n- Verificați că notificările și notificările pe ecranul de blocare sunt activate pentru aplicație
