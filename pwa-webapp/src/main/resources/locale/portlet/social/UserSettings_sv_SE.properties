UserSettings.pwa.notification.deliveryStatus.drawer.body=En eller flera push-aviseringar försenades. Det kan hända om:\n- Batterioptimering är aktiverad\n- Energisparläge är aktivt\n- Enheten var offline\n- Nätverksanslutningen var instabil\n- Webbläsaren eller appen stängdes av systemet\n\nFör att förbättra leveransen av aviseringar kan du kontrollera följande inställningar på enheten:\n- Inaktivera batterioptimering för appen och låt den köras i bakgrunden\n- Se till att bakgrundsaktivitet är aktiverad för appen\n- Kontrollera att aviseringar och aviseringar på låsskärmen är aktiverade för appen
