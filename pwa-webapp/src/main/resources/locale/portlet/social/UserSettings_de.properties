UserSettings.pwa.notification.deliveryStatus.drawer.body=Eine oder mehrere Push-Benachrichtigungen wurden verzögert. Mögliche Ursachen:\n- Die Akkuoptimierung ist aktiviert\n- Der Energiesparmodus ist aktiv\n- Das Gerät war offline\n- Die Netzwerkverbindung war instabil\n- Der Browser oder die App wurde vom System geschlossen\n\nUm die Zustellung von Benachrichtigungen zu verbessern, überprüfen Sie die folgenden Einstellungen auf Ihrem Gerät:\n- Deaktivieren Sie die Akkuoptimierung für die App und erlauben Sie ihr, im Hintergrund zu laufen\n- Stellen Sie sicher, dass die Hintergrundaktivität für die App aktiviert ist\n- Vergewissern Sie sich, dass Benachrichtigungen und Sperrbildschirm-Benachrichtigungen für die App aktiviert sind
