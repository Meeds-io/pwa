UserSettings.pwa.notification.deliveryStatus.drawer.title=Notification Delivery Issues
UserSettings.pwa.notification.deliveryStatus.drawer.summary=⌛ Push notifications were delivered later than expected
UserSettings.pwa.notification.deliveryStatus.drawer.body=Una o più notifiche push sono state ritardate. Questo può accadere se:\n- Ottimizzazione della batteria è abilitata\n- Modalità risparmio energetico è attiva\n- Il dispositivo era offline\n- La connessione di rete era instabile\n- Il browser o l'app è stato chiuso dal sistema\n\nPer migliorare la consegna delle notifiche, controlli le seguenti impostazioni sul Suo dispositivo:\n- Disabiliti l'ottimizzazione della batteria per l'app e le permetta di funzionare in background\n- Si assicuri che l'attività in background sia abilitata per l'app\n- Verifichi che le notifiche e le notifiche nella schermata di blocco siano abilitate per l'app
