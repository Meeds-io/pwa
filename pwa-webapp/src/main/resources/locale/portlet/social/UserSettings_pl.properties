UserSettings.pwa.notification.deliveryStatus.drawer.body=Co najmniej jedno powiadomienie push zostało opóźnione. Może się tak zdarzyć, gdy:\n- włączona jest optymalizacja baterii\n- aktywny jest tryb oszczędzania energii\n- urządzenie było offline\n- połączenie sieciowe było niestabilne\n- przeglądarka lub aplikacja została zamknięta przez system\n\nAby poprawić dostarczanie powiadomień, sprawdź następujące ustawienia urządzenia:\n- Wyłącz optymalizację baterii dla aplikacji i zezwól jej na działanie w tle\n- Upewnij się, że aktywność w tle jest włączona dla aplikacji\n- Sprawdź, czy powiadomienia i powiadomienia na ekranie blokady są włączone dla aplikacji
