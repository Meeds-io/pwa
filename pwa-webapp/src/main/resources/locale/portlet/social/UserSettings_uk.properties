UserSettings.pwa.notification.deliveryStatus.drawer.summary=⌛ Push-сповіщення було доставлено пізніше, ніж очікувалося
UserSettings.pwa.notification.deliveryStatus.drawer.body=Одне або кілька push-сповіщень надійшли із затримкою. Це може статися, якщо:\n- увімкнено оптимізацію батареї\n- активний режим енергозбереження\n- пристрій був офлайн\n- мережеве з’єднання було нестабільним\n- браузер або застосунок було закрито системою\n\nЩоб покращити доставку сповіщень, перевірте такі налаштування на своєму пристрої:\n- вимкніть оптимізацію батареї для застосунку та дозвольте йому працювати у фоновому режимі\n- переконайтеся, що для застосунку увімкнено фонову активність\n- переконайтеся, що для застосунку увімкнено сповіщення та сповіщення на заблокованому екрані
