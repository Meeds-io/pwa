pwaSettings.enablePwa=Leisti naudotojams įdiegti {0}progresyvią žiniatinklio programą{1}
pwaSettings.enablePwa.tooltip=Kodėl verta naudoti progresyvią žiniatinklio programą (PWA)?
pwaSettings.enablePwa.help1=Progresyvi žiniatinklio programa (PWA) leidžia jūsų vartotojams pasiekti platformą taip, lyg tai būtų vietinė programa, siūlanti greitesnę ir labiau integruotą patirtį bet kuriame įrenginyje. 
pwaSettings.enablePwa.help2=PWA turės jūsų bendruomenės spalvas, logotipus ir prekės ženklą, suteikdama suasmenintą į programą panašią sąsają.
pwaSettings.enablePwa.help3=Jei įjungta, vartotojai bus raginami įdiegti PWA, kad būtų lengviau pasiekti jūsų bendruomenės prekės ženklą. Priešingu atveju jie turės naudoti platformą savo žiniatinklio naršyklėje.
pwaSettings.enablePwa.help4=Pastaba: šiai funkcijai reikalingas PWA standartų palaikymas naršyklėje ir operacinėje sistemoje, o tai reiškia, kad ji pasiekiama tik moderniuose, naujausiuose įrenginiuose ir naršyklėse.

