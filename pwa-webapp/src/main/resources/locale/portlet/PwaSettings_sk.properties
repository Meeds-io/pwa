pwaSettings.enablePwa=Povoliť používateľom inštalovať {0}progresívnu webovú aplikáciu{1}
pwaSettings.enablePwa.tooltip=Prečo progresívna webová aplikácia (PWA)?
pwaSettings.enablePwa.help1=Progresívna webová aplikácia (PWA) umožňuje vašim používateľom pristupovať k platforme, ako keby to bola natívna aplikácia, a ponúka rýchlejšie a integrovanejšie prostredie na akomkoľvek zariadení.
pwaSettings.enablePwa.help2=PWA bude obsahovať farby, logá a značky vašej komunity a poskytne prispôsobené rozhranie podobné aplikácii.
pwaSettings.enablePwa.help3=Ak je povolená, používatelia budú vyzvaní, aby si nainštalovali PWA, aby mali jednoduchý prístup k značke vašej komunity. V opačnom prípade budú musieť platformu používať prostredníctvom webového prehliadača.
pwaSettings.enablePwa.help4=Poznámka: Táto funkcia vyžaduje podporu štandardov PWA zo strany prehliadača a operačného systému, čo znamená, že je dostupná iba na moderných, aktuálnych zariadeniach a prehliadačoch.

