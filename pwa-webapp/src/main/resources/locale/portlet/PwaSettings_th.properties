pwaSettings.enablePwa.tooltip=เหตุใดจึงต้องใช้ Progressive Web App (PWA)
pwaSettings.enablePwa.help1=Progressive Web App (PWA) ช่วยให้ผู้ใช้ของคุณสามารถเข้าถึงแพลตฟอร์มได้ราวกับว่าเป็นแอปเนทีฟ ซึ่งมอบประสบการณ์ที่รวดเร็วและบูรณาการมากขึ้นบนอุปกรณ์ใดก็ได้
pwaSettings.enablePwa.help2=PWA จะแสดงสี โลโก้ และการสร้างแบรนด์ของชุมชนของคุณ โดยให้มีลักษณะคล้ายแอปที่ปรับแต่งได้ตามความต้องการ
pwaSettings.enablePwa.help3=หากเปิดใช้งาน ผู้ใช้จะได้รับแจ้งให้ติดตั้ง PWA เพื่อให้เข้าถึงแบรนด์ชุมชนของคุณได้ง่าย มิฉะนั้น ผู้ใช้จะต้องใช้แพลตฟอร์มผ่านเว็บเบราว์เซอร์
pwaSettings.enablePwa.help4=หมายเหตุ: ฟีเจอร์นี้ต้องการการรองรับมาตรฐาน PWA โดยเบราว์เซอร์และระบบปฏิบัติการ ซึ่งหมายความว่าฟีเจอร์นี้จะใช้ได้เฉพาะในอุปกรณ์และเบราว์เซอร์ที่ทันสมัยและเป็นปัจจุบันเท่านั้น

