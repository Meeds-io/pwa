pwaSettings.enablePwa.tooltip=Miks on progressiivne veebirakendus (PWA)?
pwaSettings.enablePwa.help1=Progressiivne veebirakendus (PWA) võimaldab teie kasutajatel platvormile juurde pääseda nii, nagu see oleks omarakendus, pakkudes kiiremat ja integreeritumat kasutuskogemust mis tahes seadmes. 
pwaSettings.enablePwa.help2=PWA-l on teie kogukonna värvid, logod ja kaubamärgid, pakkudes isikupärastatud rakenduselaadset liidest.
pwaSettings.enablePwa.help3=Kui see on lubatud, palutakse kasutajatel installida PWA, et teie kogukonna kaubamärgile hõlpsasti juurde pääseda. Vastasel juhul peavad nad platvormi kasutama oma veebibrauseri kaudu.
pwaSettings.enablePwa.help4=Märkus. See funktsioon nõuab brauseri ja operatsioonisüsteemi PWA-standardite tuge, mis tähendab, et see on saadaval ainult kaasaegsetes, ajakohastatud seadmetes ja brauserites.

